<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .invite-wrap {
    position: relative;
    display: block;
    width: 100%;
    max-width: 700px;
  }

  .invite-image {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity 1.6s ease;
  }

  .invite-image.show {
    opacity: 1;
  }

  /* ===== 버튼 공통 스타일 ===== */
  .invite-btn {
    position: absolute;
    display: block;
    width: 100%;
    height: auto;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
    opacity: 0;
  }

  .invite-btn img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
  }

  .invite-btn.show {
    opacity: 1;
  }

  /* 눌리는(press) 효과 */
  .invite-btn:hover {
    filter: brightness(1.08);
  }

  .invite-btn:active,
  .invite-btn.pressed {
    transform: scale(0.94);
    filter: brightness(0.9);
  }

  /* ===== 버튼 위치 (원본 이미지 961x8000 기준 %) ===== */
  #btn-experience {
    left: 7.39%;
    width: 84.70%;
    top: 77.40%;
    height: 1.50%;
  }

  #btn-donate {
    left: 14.67%;
    width: 71.18%;
    top: 86.10%;
    height: 1.59%;
  }

  #btn-apply {
    left: 14.57%;
    width: 71.07%;
    top: 88.76%;
    height: 1.59%;
  }
</style>
</head>
<body>

  <div class="invite-wrap">
    <img
      src="file.png"
      alt="THE HACK : PRIVATE PARTY 초대장"
      class="invite-image"
      id="inviteImg"
    >

    <button type="button" class="invite-btn" id="btn-experience" aria-label="서비스 체험하기">
      <img src="서비스_체험하기.svg" alt="서비스 체험하기">
    </button>

    <button type="button" class="invite-btn" id="btn-donate" aria-label="후원하기">
      <img src="후원하기.svg" alt="후원하기">
    </button>

    <button type="button" class="invite-btn" id="btn-apply" aria-label="지원자 풀 등록하기">
      <img src="지원자풀등록하기.svg" alt="지원자 풀 등록하기">
    </button>
  </div>

  <script>
    const img = document.getElementById('inviteImg');
    const buttons = document.querySelectorAll('.invite-btn');

    function fadeIn() {
      // 다음 프레임에 클래스를 추가해서 트랜지션이 확실히 걸리도록 함
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          img.classList.add('show');
          buttons.forEach(btn => btn.classList.add('show'));
        });
      });
    }

    if (img.complete) {
      fadeIn();
    } else {
      img.addEventListener('load', fadeIn);
    }

    // 터치 기기에서도 눌리는 효과가 확실히 보이도록 처리
    buttons.forEach(btn => {
      const press = () => btn.classList.add('pressed');
      const release = () => btn.classList.remove('pressed');

      btn.addEventListener('touchstart', press, { passive: true });
      btn.addEventListener('touchend', release);
      btn.addEventListener('touchcancel', release);
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);

      btn.addEventListener('click', () => {
        // TODO: 실제 링크 연결 (아래 주소를 원하는 URL로 교체하세요)
        // window.location.href = 'https://example.com';
      });
    });
  </script>

</body>
</html>
